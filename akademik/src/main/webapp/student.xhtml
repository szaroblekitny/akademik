<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="pl" xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Akademik</title>
	<link rel="stylesheet" type="text/css" href="akademik.css"/>
</h:head>
<h:body>
	<ui:composition template = "template/template.xhtml">
		<!-- przy każdym wejściu na stronę (GET, nie przy kliknięciach AJAX) lista wczytuje się
		     z bazy na nowo, więc po imporcie czy kwaterowaniu nie jest nieaktualna (audyt A3) -->
		<ui:define name="metadata">
			<f:metadata>
				<f:viewAction action="#{studentBean.wczytaj}"/>
			</f:metadata>
		</ui:define>
    	<ui:define name = "header">
			<h3>Studenci</h3>
		</ui:define>

		<ui:define name = "content">
			<!-- Edycja tabeli studentów  -->
			<h:form id="form">
				<!-- wyskakujące komunikaty -->
				<p:growl id="msgs" showDetail="true"/>

				<p:dataTable id="studentTab" widgetVar="studenci" var="student" value="#{studentBean.studenci}" editable="true" class="dolnymargines">
	        		<f:facet name="header">Studenci</f:facet>

	        		<p:ajax event="rowEdit" listener="#{studentBean.onRowEdit}" update=":form:msgs" />
	        		<p:ajax event="rowEditCancel" listener="#{studentBean.onRowCancel}" update=":form:msgs" />

	 				<!-- Id tylko wyświetlane -->
	        		<p:column id="colidstudenta" headerText="Id studenta">
	            		<h:outputText value="#{student.id}" />
	        		</p:column>

	        		<p:column id="colimie" headerText="Imie">
	            		<p:cellEditor>
	                		<f:facet name="output"><h:outputText value="#{student.imie}" /></f:facet>
	                		<f:facet name="input"><p:inputText value="#{student.imie}" class="szerokosc100procent" required="true" requiredMessage="Podaj imię studenta" /></f:facet>
	            		</p:cellEditor>
	        		</p:column>

	        		<p:column id="colnazwisko" headerText="Nazwisko">
	            		<p:cellEditor>
	                		<f:facet name="output"><h:outputText value="#{student.nazwisko}" /></f:facet>
							<f:facet name="input"><p:inputText value="#{student.nazwisko}" class="szerokosc100procent" required="true" requiredMessage="Podaj nazwisko studenta"/></f:facet>
	            		</p:cellEditor>
	        		</p:column>

	        		<!-- Płcie -->
	        		<p:column id="colplec" headerText="Płeć">
	        			<p:cellEditor>
	                		<f:facet name="output">
		        			<p:selectOneRadio value="#{student.plec}" unselectable="false" disabled="true">
		            			<f:selectItem itemLabel="Kobieta" itemValue="KOBIETA" />
		            			<f:selectItem itemLabel="Mężczyzna" itemValue="MEZCZYZNA" />
		        			</p:selectOneRadio>
		        			</f:facet>
		        			<f:facet name="input">
		        			<p:selectOneRadio value="#{student.plec}" unselectable="false" disabled="false">
		            			<f:selectItem itemLabel="Kobieta" itemValue="KOBIETA" />
		            			<f:selectItem itemLabel="Mężczyzna" itemValue="MEZCZYZNA" />
		        			</p:selectOneRadio>
		        			</f:facet>
	        			</p:cellEditor>
	    			</p:column>

	        		<!-- guzik edycji -->
	        		<p:column id="guzikedycji" class="kolumnaedycji">
	            		<p:rowEditor />
	        		</p:column>
	        	</p:dataTable>

       			<!-- fokus - tworzenie nowego studenta w panelu -->
       			<p:panel id="panel" header="Nowy student">

        			<p:focus context="panel"/>

        			<h:panelGrid columns="3">
        				<div>
	        				<p:outputLabel for="studsurname" value="Imię" />
	            			<p:inputText id="studsurname" value="#{studentBean.imie}" required="true" requiredMessage="Podaj imię studenta" />
            			</div>
            			<div>
	        				<p:outputLabel for="studentname" value="Nazwisko" />
	            			<p:inputText id="studentname" value="#{studentBean.nazwisko}" required="true" requiredMessage="Podaj nazwisko studenta"/>
            			</div>
            			<div>
            				<p:outputLabel for="studentplec" value="Płeć" />
            				<!-- required: bez płci student nie trafi do bazy (błąd z 11.11.2026) -->
            				<p:selectOneRadio id="studentplec" value="#{studentBean.plec}" unselectable="false" disabled="false"
            						required="true" requiredMessage="Wybierz płeć studenta">
		            			<f:selectItem itemLabel="Kobieta" itemValue="KOBIETA" />
		            			<f:selectItem itemLabel="Mężczyzna" itemValue="MEZCZYZNA" />
		        			</p:selectOneRadio>
            			</div>
        			</h:panelGrid>
        			<!-- p:outputLabel sam dopisuje gwiazdkę przy polu z required="true" -->
        			<p class="przypis">Pola oznaczone gwiazdką (*) są wymagane.</p>

        			<p:commandButton value="Zapisz" styleClass="ui-priority-primary" process="@parent" update=":form:msgs"
                            action="#{studentBean.onAddNew()}"
                            oncomplete="if (!args.validationFailed) PF('studenci').addRow();"/>
    			</p:panel>

	        	<!-- ooooooooooooooooo -->
			</h:form>
		</ui:define> 
		<!-- koniec treści strony, poniżej jest jeszcze stopka -->
	</ui:composition>

</h:body>
</html>

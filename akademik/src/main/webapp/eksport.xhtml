<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="pl" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Akademik</title>
	<link rel="stylesheet" type="text/css" href="akademik.css"/>
</h:head>
<h:body>
	<ui:composition template = "template/template.xhtml">
    	<ui:define name = "header">
			<h3>Eksport</h3>
		</ui:define>

		<ui:define name = "content">
			<!-- skrypt musi być wewnątrz ui:define: Facelets pomija wszystko, co stoi -->
			<!-- poza ui:composition, więc w h:head te funkcje w ogóle nie trafiały na stronę -->
			<script type="text/javascript">
			//<![CDATA[
			function start() {
				PF('statusDialog').show();
			}

			function stop() {
				PF('statusDialog').hide();
			}
			//]]>
			</script>

			<p:dialog modal="true" widgetVar="statusDialog" header="Status" draggable="false" closable="false" resizable="false">
    			<h:outputText value="Chwilka..." />
			</p:dialog>

			<h:form>
				<div class="otoczkaBut">
	    			<p:commandButton value="Eksport" ajax="false" onclick="PrimeFaces.monitorDownload(start, stop);" icon="pi pi-download">
	        			<p:fileDownload value="#{eksportBean.content}" />
	    			</p:commandButton>
    			</div>
			</h:form>

		</ui:define> 

	</ui:composition>
</h:body>
</html>
